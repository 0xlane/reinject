{{ if .IsTranslated }}
  {{ range .Translations }}
    <a href="{{ .RelPermalink }}" class="lang-switch" title="{{ .Language.LanguageName }}">{{ .Language.LanguageName }}</a>
  {{ end }}
{{ else }}
  {{ range .Site.Home.AllTranslations }}
    {{ if ne .Language.Lang $.Site.Language.Lang }}
      <a href="{{ .RelPermalink }}" class="lang-switch" title="{{ .Language.LanguageName }}">{{ .Language.LanguageName }}</a>
    {{ end }}
  {{ end }}
{{ end }}
