      keywords:
        - 网络安全
        - CTF
        - Windows安全
        - 安全博客
        - 二进制安全
        - 安全研究
        - 主机安全
        - 入侵检测
        - 漏洞分析
        - 攻防对抗
    menu:
      main:
        - identifier: home
          pre: icon-home
          name: 首页
          url: /
          weight: 1
        - identifier: about
          pre: icon-about
          name: 关于
          url: /about/
          weight: 2
        - identifier: posts
          pre: icon-post
          name: 文章
          url: /posts/
          weight: 3
        - identifier: categories
          pre: icon-category
          name: 分类
          url: /categories/
          weight: 4
